version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_AGORA_APP_ID=${VITE_AGORA_APP_ID}
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

networks:
  default:
    name: nexus-network
